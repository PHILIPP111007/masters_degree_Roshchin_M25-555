[tool.poetry]
name = "valutatrade-hub"
version = "0.1.0"
description = "CLI приложение для управления крипто-портфелем"
authors = ["Roshchin M55-255 <student@example.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
python-dateutil = "^2.8.2"
tomli = "^2.3.0"
requests = "^2.31.0"

[tool.poetry.scripts]
project = "main:main"

[tool.poetry.group.dev.dependencies]
ruff = "^0.13.2"
pytest = "^7.0.0"
pytest-cov = "^4.0.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.0.0"
pytest-mock = "^3.10.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0", "setuptools", "wheel"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["F403", "F401"]

[tool.valutatrade]
data_dir = "data"
log_dir = "logs"
log_level = "INFO"
log_format = "json"
default_base_currency = "USD"
rates_ttl_seconds = 300
session_ttl_hours = 24
max_log_size_mb = 10
max_log_files = 5
supported_currencies = [
    "USD",
    "EUR",
    "GBP",
    "JPY",
    "CHF",
    "CAD",
    "AUD",
    "CNY",
    "RUB",
    "BTC",
    "ETH",
    "LTC",
    "XRP",
    "ADA",
    "DOT",
    "DOGE",
    "SOL",
]
